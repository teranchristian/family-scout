name: Family Scout tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Family Scout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile helper scripts and tests
        run: python3 -m compileall -q scripts tests
